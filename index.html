<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawsonality Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:14px;">
    <svg width="48" height="48" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- ears behind head -->
      <ellipse cx="13" cy="13" rx="6.5" ry="8" fill="white"/>
      <ellipse cx="31" cy="13" rx="6.5" ry="8" fill="white"/>
      <!-- head -->
      <circle cx="22" cy="25" r="15" fill="white"/>
      <!-- eyes -->
      <circle cx="17" cy="23" r="2.2" fill="#2d7a50"/>
      <circle cx="27" cy="23" r="2.2" fill="#2d7a50"/>
      <!-- nose -->
      <ellipse cx="22" cy="27.5" rx="2" ry="1.5" fill="#2d7a50"/>
      <!-- mouth -->
      <path d="M19.5 30.5 Q22 33 24.5 30.5" stroke="#2d7a50" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    </svg>
    <div>
      <h1>Pawsonality Test</h1>
      <p>Browse, search, and filter recognized breeds</p>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="search" placeholder="Search breeds…" />
  </div>

  <div class="filter-group" id="size-filters">
    <span class="filter-label">Size</span>
    <button class="chip active" data-size="">All</button>
    <button class="chip" data-size="small">Small</button>
    <button class="chip" data-size="medium">Medium</button>
    <button class="chip" data-size="large">Large</button>
  </div>

  <div class="filter-group" id="temp-filters">
    <span class="filter-label">Temperament</span>
    <button class="chip active" data-temp="">All</button>
  </div>

  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
